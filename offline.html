<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#080B14" />
<meta name="color-scheme" content="dark" />
<title>WalletOS — آفلاین</title>
<style>
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #14203F 0%, #080B14 55%, #060810 100%);
    color: #EDF1FB;
    font-family: 'Vazirmatn', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #111629;
    border: 1px solid rgba(148,163,207,0.22);
    border-radius: 24px;
    padding: 30px 24px;
    animation: wosPop .3s cubic-bezier(.2,.8,.2,1) both;
  }
  h1 { font-size: 18px; font-weight: 800; margin: 16px 0 8px; }
  p { font-size: 13px; line-height: 1.9; color: #8D96B8; margin: 0; }
  button {
    margin-top: 22px;
    padding: 12px 26px;
    border: 0;
    border-radius: 14px;
    background: #3E7BFA;
    color: #0A0E1A;
    font-family: inherit;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }
  button:active { transform: scale(.97); }
  .dot { width: 54px; height: 54px; margin: 0 auto; border-radius: 50%; background: rgba(251,113,133,0.14); display: flex; align-items: center; justify-content: center; }
  @keyframes wosPop { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
</style>
</head>
<body>
  <div class="card">
    <div class="dot">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FB7185" stroke-width="2" stroke-linecap="round">
        <path d="M3 3l18 18M8.5 16.5a4.5 4.5 0 006.1-6.1M5 10.5a9 9 0 0112.6-1.4M19 13.5a9 9 0 01-3.2 3.4" />
      </svg>
    </div>
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>
      نگران نباشید — همهٔ تراکنش‌ها، بودجه‌ها و اهداف شما روی همین دستگاه ذخیره شده‌اند
      و بعداً دقیقاً همان‌جا که بودید در دسترس خواهند بود.
    </p>
    <button type="button" onclick="location.reload()">تلاش دوباره</button>
  </div>
</body>
</html>
